appId: com.jordan.homeplanner
productName: Home Planner
copyright: Copyright © 2026
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - "**/node_modules/node-html-parser/**"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # HomeSync app icon — requires ./build/icon.ico (256x256+ multi-resolution).
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Home Planner
  runAfterFinish: true
  # Upgrade behaviour: keep user data (events, widgets, backups) on uninstall
  # so in-place upgrades never wipe the user's config.
  deleteAppDataOnUninstall: false
  # Emit a blockmap + diff manifest so future auto-update can do delta downloads.
  differentialPackage: true

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# Auto-update feed. Public GitHub repo — installed clients read releases
# anonymously, no token needed at runtime. Publishing a release from this
# machine requires GH_TOKEN env var with `repo` scope.
publish:
  - provider: github
    owner: jordanplex1-ux
    repo: Home-Automation-Application
    releaseType: release
