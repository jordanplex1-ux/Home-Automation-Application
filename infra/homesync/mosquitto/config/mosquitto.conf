# Mosquitto — MQTT broker for the HomeSync stack.
# Authenticated only; anonymous access is explicitly disabled.

listener 1883

# No anonymous clients. Create the password file before first start:
#   docker run --rm -it -v "$PWD/mosquitto/config:/mosquitto/config" \
#     eclipse-mosquitto:2 mosquitto_passwd -c /mosquitto/config/passwd homesync
allow_anonymous false
password_file /mosquitto/config/passwd

# Survive restarts (retained messages, subscriptions)
persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker compose logs mosquitto` is the single place to look
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
