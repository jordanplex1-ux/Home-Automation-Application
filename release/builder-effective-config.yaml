directories:
  output: release
  buildResources: build
appId: com.jordan.homeplanner
productName: Home Planner
copyright: Copyright © 2026
artifactName: ${productName}-${version}-${arch}.${ext}
files:
  - filter:
      - out/**/*
      - package.json
asar: true
asarUnpack:
  - '**/node_modules/node-html-parser/**'
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Home Planner
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  differentialPackage: true
portable:
  artifactName: ${productName}-${version}-portable.${ext}
publish:
  - provider: github
    owner: jordanplex1-ux
    repo: Home-Automation-Application
    releaseType: release
electronVersion: 34.5.8
